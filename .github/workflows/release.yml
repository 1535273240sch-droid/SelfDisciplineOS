name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Download the verified APK artifact
        uses: actions/download-artifact@v4
        with:
          name: aether-apk
          run-id: '44836675510'
          github-token: ${{ github.token }}
          path: dist

      - name: Upload and publish the verified APK
        env:
          GH_TOKEN: ${{ github.token }}
          AETHER_TAG: ${{ inputs.tag }}
          AETHER_BUILD_COMMIT: 4d78a79549255f18aae322ade204b87fb1c57465
          AETHER_APK_SHA256: df088e788e724cfd5ac586b829528118114fe5dcf1cfb3d14fb001c9db880d65
        run: |
          set -euo pipefail
          test "$AETHER_TAG" = v2.2.1
          api_path="repos/$GITHUB_REPOSITORY/releases/453282845"
          gh api "$api_path" > release.json
          jq -e --arg tag "$AETHER_TAG" --arg commit "$AETHER_BUILD_COMMIT" \
            '.draft and .tag_name == $tag and .target_commitish == $commit and (.assets | length == 0)' release.json
          printf '%s  %s\n' "$AETHER_APK_SHA256" dist/app-release.apk | sha256sum -c -
          asset="AetherOS-${AETHER_TAG}.apk"
          mv dist/app-release.apk "dist/$asset"
          gh release upload "$AETHER_TAG" "dist/$asset" --repo "$GITHUB_REPOSITORY"
          gh api "$api_path" > release.json
          jq -e --arg asset "$asset" --arg digest "sha256:$AETHER_APK_SHA256" \
            '.draft and (.assets | length == 1) and (.assets[0] | .name == $asset and .state == "uploaded" and .digest == $digest)' release.json
          gh release edit "$AETHER_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
