name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v2.1.0"
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_B64:-}" ]; then
            mkdir -p keystore
            printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > keystore/aether-release.jks
            ls -l keystore/aether-release.jks
          else
            echo "::warning::ANDROID_KEYSTORE_B64 未配置，将退回 debug 签名"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SM="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -1)"
          yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SM" --sdk_root="$SDK" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: chmod +x ./gradlew && ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        id: apk
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/AetherOS-${TAG}.apk"
          ls -lh dist
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: Aether OS ${{ steps.apk.outputs.tag }}
          body: |
            自律系统 v2.1.3 —— 界面距离修复。

            - 全局统一处理系统栏留白：内容不再顶进状态栏/挖孔下面
            - 底部 Dock 进布局流：删除各页写死的 bottom=108dp，内容不再被遮挡也不再留大空白
            - 所有页面统一 16dp 边距、12dp 间距；锁屏与早报页同样让开系统栏
            - 界面风格、控件、文案与数据逻辑不变

            直接下载下面的 APK 安装即可（仅自用）。
          files: dist/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
