name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v2.1.0"
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK 36
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SM="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -1)"
          yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SM" --sdk_root="$SDK" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: Build release APK
        run: chmod +x ./gradlew && ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK
        id: apk
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/AetherOS-${TAG}.apk"
          ls -lh dist
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk.outputs.tag }}
          name: Aether OS ${{ steps.apk.outputs.tag }}
          body: |
            自律系统 v2.1 —— AI 闭环 + Bento 玻璃界面。

            - AI 工具链闭环：工具结果回填、最多 3 轮、失败不冒充成功
            - 模型配置：Key 加密保存/更换、一键拉取 /v1/models、6 个场景绑定
            - UI：热量环、74% 玻璃语音抽屉、纯黑夜间锁屏

            直接下载下面的 APK 安装即可（debug 签名，仅自用）。
          files: dist/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
